<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP 패널</title>
<style>
:root {
  --bg: #060a12; --panel: #0c1422; --panel2: #111c2e; --line: #1d3350;
  --text: #d9e4f5; --muted: #7c8da8; --accent: #5ad1ff; --gold: #ffd166;
  --bad: #ff5d6c; --good: #5fe3a1;
  --num: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; background: radial-gradient(1200px 600px at 50% -200px, #10233d 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--text); font: 14px/1.55 -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  min-height: 100vh;
}
main { max-width: 760px; margin: 0 auto; padding: 16px 14px 60px; }
header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
nav { display: flex; gap: 4px; margin: 14px 0 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
nav button {
  background: none; border: 0; color: var(--muted); font: inherit; padding: 8px 10px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
nav button:hover { color: var(--text); }
nav button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
nav button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.win {
  background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
  border-radius: 6px; padding: 14px; margin-bottom: 12px;
  box-shadow: 0 0 0 1px #5ad1ff10 inset, 0 0 24px #5ad1ff0d;
}
.win > h2 { margin: 0 0 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; color: var(--accent); }
.muted { color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }

.who { display: flex; gap: 12px; align-items: center; }
.who h3 { margin: 0; font-size: 17px; }
.who p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.avatar {
  flex: none; width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--line); background: #0a1220;
  display: grid; place-items: center; font-weight: 700; color: var(--accent); overflow: hidden;
}
.avatar.lg { width: 72px; height: 72px; font-size: 26px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.grade {
  margin-left: auto; flex: none; font: 700 22px/1 var(--num); width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid currentColor; border-radius: 6px; text-shadow: 0 0 12px currentColor;
}
.g-E { color: #9aa7b8; } .g-D { color: var(--good); } .g-C { color: var(--accent); }
.g-B { color: #b48cff; } .g-A { color: var(--gold); } .g-S { color: var(--bad); }

.gauge { margin-top: 12px; }
.gauge .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.gauge .row b { color: var(--text); font: 600 13px var(--num); }
.bar { height: 8px; background: #0a1220; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #2a9d6f, var(--good)); transition: width .5s; }
.bar.low i { background: linear-gradient(90deg, #a8303c, var(--bad)); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { background: #0a1220; border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px; text-align: center; }
.stats span { display: block; font-size: 11.5px; color: var(--muted); }
.stats b { font: 700 19px var(--num); }
.pos { color: var(--good); } .neg { color: var(--bad); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.good { color: var(--good); border-color: #5fe3a155; } .chip.bad { color: var(--bad); border-color: #ff5d6c55; }
.chip.warn { color: var(--gold); border-color: #ffd16655; } .chip.info { color: var(--accent); border-color: #5ad1ff55; }

details { border-top: 1px solid var(--line); }
details:first-of-type { border-top: 0; }
summary { list-style: none; cursor: pointer; padding: 9px 2px; display: flex; align-items: center; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "›"; margin-left: auto; color: var(--muted); transition: transform .15s; }
details[open] > summary::after { transform: rotate(90deg); }
summary .chip { margin-left: auto; }
summary:has(.chip)::after { margin-left: 0; }
details .body { padding: 0 2px 12px; color: #b9c7dc; font-size: 13px; }
details .body p { margin: 0 0 6px; }
details .body h4 { margin: 10px 0 4px; font-size: 11.5px; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
details .body ul { margin: 0; padding-left: 18px; }
.locked summary b { color: var(--muted); }
.dead { opacity: .55; filter: grayscale(1); }

.rows div { display: flex; justify-content: space-between; padding: 6px 2px; border-top: 1px solid var(--line); }
.rows div:first-child { border-top: 0; }
.rows b { font: 600 14px var(--num); }
.rows small { display: block; color: var(--muted); font-size: 11.5px; }

.profile { display: flex; gap: 12px; margin-bottom: 4px; }
.clue { padding: 7px 2px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.clue:first-child { border-top: 0; }
.clue::before { content: "◆"; color: var(--accent); font-size: 9px; margin-top: 5px; }
.clue.done { color: var(--muted); text-decoration: line-through; } .clue.done::before { color: var(--muted); }

.roll { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--line); }
.roll:first-child { border-top: 0; }
.roll .calc { font: 13px var(--num); color: var(--muted); }
.roll .calc b { color: var(--text); font-size: 15px; }
.crit { color: var(--gold) !important; } .fumble { color: var(--bad) !important; }

#dice { position: fixed; inset: 0; background: #03060cdd; display: grid; place-items: center; z-index: 10; cursor: pointer; }
#dice[hidden] { display: none; }
#dice .box { text-align: center; }
#dice .name { color: var(--muted); letter-spacing: .12em; font-size: 13px; }
#dice .d20 {
  width: 150px; height: 150px; margin: 16px auto; display: grid; place-items: center; font: 700 64px var(--num);
  color: var(--accent); border: 2px solid currentColor; text-shadow: 0 0 24px currentColor; box-shadow: 0 0 40px #5ad1ff33, 0 0 40px #5ad1ff22 inset;
  clip-path: polygon(50% 0, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%); background: #0c1a2c;
}
#dice .d20.spin { animation: shake .12s infinite; }
#dice .calc { font: 16px var(--num); min-height: 24px; }
#dice .verdict { font-size: 26px; font-weight: 800; letter-spacing: .2em; margin-top: 8px; min-height: 40px; }
.clock { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.clock .segs { display: flex; gap: 3px; margin-left: auto; }
.clock .segs i { width: 16px; height: 10px; border: 1px solid var(--line); border-radius: 2px; background: #0a1220; transform: skewX(-18deg); }
.clock .segs i.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px #5ad1ff88; }
.clock.bad .segs i.on { background: var(--bad); border-color: var(--bad); box-shadow: 0 0 8px #ff5d6c88; }
.clock.bad.full { color: var(--bad); }
.enemy { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.enemy .grade { width: 30px; height: 30px; font-size: 15px; margin: 0; grid-row: span 2; }
.enemy .top { display: flex; gap: 8px; align-items: baseline; }
.enemy .top span { margin-left: auto; font: 12px var(--num); color: var(--muted); }
.enemy .bar { margin: 0; } .enemy .bar i { background: linear-gradient(90deg, #a8303c, var(--bad)); }
.enemy .tags { grid-column: 2; margin-top: 2px; }
.enemy.down { opacity: .45; } .enemy.down b { text-decoration: line-through; }
.hud h5 { margin: 12px 0 2px; font-size: 10.5px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
.hud .mine { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.ln.loot { display: flex; gap: 12px; align-items: center; border: 1px solid currentColor; border-radius: 6px; padding: 10px 12px;
  background: linear-gradient(100deg, #0a1220 40%, color-mix(in srgb, currentColor 14%, #0a1220)); box-shadow: 0 0 18px color-mix(in srgb, currentColor 25%, transparent); }
.ln.loot.now { animation: flip .5s ease-out; }
.ln.loot .grade { margin: 0; width: 38px; height: 38px; font-size: 19px; }
.ln.loot b { color: var(--text); font-size: 15px; } .ln.loot small { display: block; color: var(--muted); font-size: 12.5px; }
.ln.loot .tag { margin-left: auto; font-size: 10px; letter-spacing: .25em; }
.ln.bannerln { text-align: center; color: var(--gold); border-block: 1px solid #ffd16655; padding: 8px 0; font-weight: 700; letter-spacing: .12em; }
.ln.bannerln small { display: block; color: var(--muted); font-weight: 400; letter-spacing: 0; }
#banner { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; cursor: pointer; text-align: center;
  background: radial-gradient(600px 300px at 50% 50%, #3a2c0a 0%, #03060cee 70%); }
#banner[hidden] { display: none; }
#banner .rule { height: 1px; width: min(70vw, 420px); margin: 14px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: widen .6s ease-out; }
#banner h2 { margin: 0; font-size: 34px; letter-spacing: .25em; color: var(--gold); text-shadow: 0 0 30px #ffd166aa; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
#banner p { margin: 0; color: var(--text); font-size: 15px; animation: rise .5s .3s both; }
#banner small { color: var(--muted); letter-spacing: .3em; font-size: 10.5px; }
@keyframes flip { from { transform: rotateX(90deg); opacity: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes widen { from { width: 0; } }
@media (prefers-reduced-motion: reduce) { .ln.loot.now, #banner h2, #banner p, #banner .rule { animation: none; } }
.stage { cursor: pointer; min-height: 60vh; padding-bottom: 8px; user-select: none; }
.ln { margin: 0 0 14px; opacity: .5; transition: opacity .3s; }
.ln.now { opacity: 1; animation: rise .25s ease-out; }
.ln.narr { font-size: 15px; line-height: 1.8; color: #c9d6ea; }
.ln.say { display: flex; gap: 10px; align-items: flex-start; }
.ln.say .bubble { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 8px 12px 10px; }
.ln.say .name { display: block; font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: .04em; margin-bottom: 2px; }
.ln.say .bubble p { margin: 0; font-size: 15px; line-height: 1.7; }
.ln.sys { font: 13px/1.7 var(--num); color: var(--accent); background: #07182a; border: 1px solid #5ad1ff66; border-radius: 4px;
  padding: 10px 14px; box-shadow: 0 0 18px #5ad1ff22, 0 0 18px #5ad1ff14 inset; text-shadow: 0 0 8px #5ad1ff66; }
.ln.sys::before { content: "SYSTEM"; display: block; font-size: 10px; letter-spacing: .25em; color: var(--muted); text-shadow: none; }
.ln.rollln { background: #0a1220; border: 1px dashed var(--line); border-radius: 6px; padding: 0 10px; }
.next { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0; }
.next.more { animation: blink 1.2s infinite; }
.next button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 99px; font: inherit; padding: 2px 12px; cursor: pointer; margin-left: 8px; }
.turn { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
.turn h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .14em; color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .ln.now, .next.more { animation: none; } }
@keyframes shake { 0% { transform: rotate(-6deg) scale(1.03); } 50% { transform: rotate(6deg) scale(.97); } 100% { transform: rotate(-6deg) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { #dice .d20.spin { animation: none; } .bar i { transition: none; } }
@media (max-width: 420px) { .stats b { font-size: 16px; } }
</style>
</head>
<body>
<main>
  <header><h1 id="title">RP 패널</h1><p id="where"></p></header>
  <nav role="tablist" id="tabs"></nav>
  <div id="view"><p class="empty">불러오는 중…</p></div>
</main>
<div id="dice" hidden><div class="box">
  <div class="name" id="dName"></div><div class="d20" id="dNum"></div>
  <div class="calc" id="dCalc"></div><div class="verdict" id="dVerdict"></div>
</div></div>
<div id="banner" hidden><div>
  <small>SYSTEM</small><div class="rule"></div><h2 id="bTitle"></h2><div class="rule"></div><p id="bSub"></p>
</div></div>
<script>
const slug = new URLSearchParams(location.search).get('c');
const TABS = { scene: '장면', status: '상태창', npcs: '인물', clues: '단서', story: '기록', rolls: '판정' };
let tab = location.hash.slice(1) in TABS ? location.hash.slice(1) : 'scene';
let sceneId, shown = 1;
let state = null, lastText = '', lastRollId;
const open = new Set();
const $ = id => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null && v !== false) el.setAttribute(k, v);
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const signed = n => (n > 0 ? '+' : '') + n;
const won = n => n.toLocaleString('ko-KR') + '원';
const win = (title, ...kids) => h('section', { class: 'win' }, h('h2', {}, title), ...kids);
const list = items => h('ul', {}, items.map(t => h('li', {}, t)));

function avatar(name, tryImage, large) {
  const el = h('div', { class: 'avatar' + (large ? ' lg' : '') }, name[0]);
  if (tryImage) {
    const img = h('img', { alt: '', src: `portraits/${slug}/${encodeURIComponent(name)}.png` });
    img.onload = () => el.replaceChildren(img);
  }
  return el;
}

function fold(key, summaryKids, bodyKids, cls) {
  const d = h('details', { class: cls, open: open.has(key) ? '' : null },
    h('summary', {}, summaryKids), h('div', { class: 'body' }, bodyKids));
  d.addEventListener('toggle', () => d.open ? open.add(key) : open.delete(key));
  return d;
}

function hud(s, withMine) {
  const clocks = s.clocks || [], enemies = s.enemies || [];
  if (!clocks.length && !enemies.length && !withMine) return null;
  return h('div', { class: 'hud' },
    clocks.map(c => h('div', { class: 'clock' + (c.bad ? ' bad' : '') + (c.cur >= c.max ? ' full' : '') }, c.label,
      h('div', { class: 'segs', title: `${c.cur} / ${c.max}` }, Array.from({ length: c.max }, (_, i) => h('i', { class: i < c.cur ? 'on' : '' }))))),
    enemies.length ? h('h5', {}, 'ENEMY') : null,
    enemies.map(e => h('div', { class: 'enemy' + (e.down ? ' down' : '') },
      h('div', { class: 'grade g-' + (e.grade || 'E') }, e.grade || '?'),
      h('div', { class: 'top' }, h('b', {}, e.name), e.down ? h('span', {}, '처치') : e.max ? h('span', {}, `${e.cur} / ${e.max}`) : null),
      e.max && !e.down ? h('div', { class: 'bar' }, h('i', { style: `width:${100 * e.cur / e.max}%` })) : h('div', {}),
      e.traits?.length ? h('div', { class: 'tags' }, e.traits.map(t => h('span', { class: 'chip' }, t))) : null)),
    withMine ? [h('h5', {}, s.pc.name),
      h('div', { class: 'mine' },
        (s.pc.gauges || []).map(g => h('span', { class: 'chip ' + (g.cur / g.max <= 0.34 ? 'bad' : 'good') }, `${g.label} ${g.cur}/${g.max}`)),
        s.pc.skills.filter(k => k.state !== 'locked').map(k => h('span', { class: 'chip ' + (SKILL_STATE[k.state] || [])[1] }, `「${k.name}」 ${(SKILL_STATE[k.state] || [k.state])[0]}`)),
        (s.pc.conditions || []).map(c => h('span', { class: 'chip warn' }, c)))] : null);
}

const SKILL_STATE = { ready: ['사용 가능', 'good'], used: ['사용함', 'warn'], settling: ['정착 중', 'warn'], locked: ['잠김', ''] };

function viewStatus(s) {
  const pc = s.pc;
  const enc = hud(s);
  return [
    enc && win('ENCOUNTER', enc),
    win('STATUS',
      h('div', { class: 'who' }, avatar(pc.name, true),
        h('div', {}, h('h3', {}, pc.name), h('p', {}, pc.blurb)),
        pc.grade && h('div', { class: 'grade g-' + pc.grade, title: pc.grade + '급' }, pc.grade)),
      (pc.gauges || []).map(g => h('div', { class: 'gauge' },
        h('div', { class: 'row' }, g.label, h('b', {}, `${g.cur} / ${g.max}`)),
        h('div', { class: 'bar' + (g.cur / g.max <= 0.34 ? ' low' : '') }, h('i', { style: `width:${100 * g.cur / g.max}%` })))),
      pc.conditions?.length ? h('div', { class: 'tags' }, pc.conditions.map(c => h('span', { class: 'chip warn' }, c))) : null),
    win('ABILITY', h('div', { class: 'stats' }, Object.entries(pc.stats).map(([k, v]) =>
      h('div', {}, h('span', {}, k), h('b', { class: v > 0 ? 'pos' : v < 0 ? 'neg' : '' }, signed(v)))))),
    win('SKILL', pc.skills.map(k => {
      const [label, tone] = SKILL_STATE[k.state] || [k.state, ''];
      return fold('skill:' + k.name, [h('b', {}, `「${k.name}」`), h('span', { class: 'chip ' + tone }, label)],
        [k.desc && h('p', {}, k.desc), k.cost && h('p', {}, h('span', { class: 'muted' }, '대가 · '), k.cost),
         k.note && h('p', { class: 'muted' }, k.note)], k.state === 'locked' ? 'locked' : '');
    })),
    win('INVENTORY', pc.inventory.length ? pc.inventory.map(it =>
      fold('item:' + it.name, [h('span', {}, it.name), it.qty > 1 && h('span', { class: 'chip' }, '×' + it.qty)],
        h('p', {}, it.desc || '특이 사항 없음'))) : h('p', { class: 'empty' }, '비어 있음')),
    pc.money?.length ? win('WALLET', h('div', { class: 'rows' }, pc.money.map(m =>
      h('div', {}, h('span', {}, m.label, m.note && h('small', {}, m.note)), h('b', { class: m.debt ? 'neg' : '' }, (m.debt ? '-' : '') + won(m.amount)))))) : null,
  ];
}

function viewNpcs(s) {
  const card = n => fold('npc:' + n.name,
    [avatar(n.name, n.major), h('div', {}, h('b', {}, n.name), h('div', { class: 'muted' }, n.role)),
     h('span', { class: 'chip ' + (n.status ? 'bad' : n.tone || '') }, n.status || n.attitude)],
    [n.major && h('div', { class: 'profile' }, avatar(n.name, true, true),
       h('div', {}, n.age && h('p', {}, n.age + '세'), n.grade && h('p', {}, n.grade + '급'), h('p', {}, '태도 · ' + n.attitude))),
     !n.major && n.status && h('p', {}, '태도 · ' + n.attitude),
     n.speech && h('p', { class: 'muted' }, '말투 · ' + n.speech),
     n.events?.length && [h('h4', {}, '있었던 일'), list(n.events)],
     n.known?.length && [h('h4', {}, '내가 아는 것'), list(n.known)]],
    n.status === '사망' ? 'dead' : '');
  const major = s.npcs.filter(n => n.major), minor = s.npcs.filter(n => !n.major);
  return [win('주요 인물', major.map(card)), minor.length ? win('그 외', minor.map(card)) : null];
}

const viewClues = s => win('단서 · 떡밥', s.clues.length
  ? s.clues.map(c => h('div', { class: 'clue' + (c.done ? ' done' : '') }, c.text))
  : h('p', { class: 'empty' }, '아직 없음'));

const viewStory = s => win('지난 이야기', s.story.map((c, i) =>
  fold('story:' + c.title, h('b', {}, c.title), h('p', {}, c.text))).reverse());

const rollRow = r => h('div', { class: 'roll' },
  h('div', {}, r.name, h('div', { class: 'muted' }, r.at)),
  h('div', { class: 'calc' }, h('span', { class: r.d20 === 20 ? 'crit' : r.d20 === 1 ? 'fumble' : '' }, r.d20),
    ` ${signed(r.mod)} = `, h('b', {}, r.total), ` / ${r.dc}`),
  h('span', { class: 'chip ' + (r.success ? 'good' : 'bad') }, verdict(r)));

function sceneLine(s, l, now) {
  const cls = 'ln ' + (now ? 'now ' : '');
  if (l.t === 'say') return h('div', { class: cls + 'say' }, avatar(l.who, true),
    h('div', { class: 'bubble' }, h('span', { class: 'name' }, l.who), h('p', {}, l.text)));
  if (l.t === 'sys') return h('div', { class: cls + 'sys' }, l.text);
  if (l.t === 'loot') return h('div', { class: cls + 'loot g-' + l.grade },
    h('div', { class: 'grade' }, l.grade), h('div', {}, h('b', {}, l.name), l.text && h('small', {}, l.text)), h('span', { class: 'tag' }, 'GET'));
  if (l.t === 'banner') return h('div', { class: cls + 'bannerln' }, l.text, l.sub && h('small', {}, l.sub));
  if (l.t === 'roll') { const r = s.rolls.find(r => r.id === l.roll); return r && h('div', { class: cls + 'rollln' }, rollRow(r)); }
  return h('p', { class: cls + 'narr' }, l.text);
}

function advance(all) {
  const lines = state?.scene?.lines || [];
  if (tab !== 'scene' || shown >= lines.length) return;
  shown = all ? lines.length : shown + 1;
  const l = lines[shown - 1], r = !all && l.t === 'roll' && state.rolls.find(r => r.id === l.roll);
  render();
  if (r) playRoll(r);
  if (!all && l.t === 'banner') playBanner(l);
  scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function viewScene(s) {
  const sc = s.scene;
  if (!sc?.lines?.length) return win('SCENE', h('p', { class: 'empty' }, '장면 없음'));
  const n = Math.min(shown, sc.lines.length), done = n >= sc.lines.length;
  const skip = h('button', {}, '전부 보기');
  skip.onclick = e => { e.stopPropagation(); advance(true); };
  const stage = h('section', { class: 'win stage' },
    sc.lines.slice(0, n).map((l, i) => sceneLine(s, l, i === n - 1)),
    done ? h('div', { class: 'turn' }, h('h4', {}, 'YOUR TURN'),
        hud(s, true), h('p', { class: 'muted' }, '채팅에 행동을 입력'))
      : h('div', { class: 'next more' }, `▼ 클릭 · Space  (${n}/${sc.lines.length})`, skip));
  stage.onclick = () => advance();
  return stage;
}

function viewRolls(s) {
  if (!s.rolls.length) return win('판정 로그', h('p', { class: 'empty' }, '아직 굴린 판정이 없음'));
  return win('판정 로그', s.rolls.slice().reverse().map(rollRow));
}
const verdict = r => r.d20 === 20 ? '대성공' : r.d20 === 1 ? '대실패' : r.success ? '성공' : '실패';

const VIEWS = { scene: viewScene, status: viewStatus, npcs: viewNpcs, clues: viewClues, story: viewStory, rolls: viewRolls };

function render() {
  $('title').textContent = state.title;
  document.title = state.title;
  $('where').textContent = [state.time, state.place].filter(Boolean).join(' · ');
  $('tabs').replaceChildren(...Object.entries(TABS).map(([k, label]) => {
    const b = h('button', { role: 'tab', 'aria-selected': k === tab }, label);
    b.onclick = () => { tab = k; history.replaceState(null, '', '#' + k); render(); };
    return b;
  }));
  $('view').replaceChildren(...[VIEWS[tab](state)].flat().filter(Boolean));
}

let diceTimer;
function playRoll(r) {
  clearTimeout(diceTimer);
  const num = $('dNum');
  $('dName').textContent = `${r.name} · 난이도 ${r.dc}`;
  $('dCalc').textContent = ''; $('dVerdict').textContent = ''; $('dVerdict').className = 'verdict';
  num.className = 'd20 spin'; $('dice').hidden = false;
  const spin = setInterval(() => num.textContent = 1 + Math.floor(Math.random() * 20), 60);
  diceTimer = setTimeout(() => {
    clearInterval(spin);
    num.textContent = r.d20;
    num.className = 'd20' + (r.d20 === 20 ? ' crit' : r.d20 === 1 ? ' fumble' : '');
    $('dCalc').textContent = `${r.d20} ${signed(r.mod)} = ${r.total}`;
    $('dVerdict').textContent = verdict(r);
    $('dVerdict').classList.add(r.success ? 'pos' : 'neg');
    diceTimer = setTimeout(() => $('dice').hidden = true, 3500);
  }, 1000);
}
function playBanner(l) {
  $('bTitle').textContent = l.text; $('bSub').textContent = l.sub || '';
  $('banner').hidden = false;
}
$('banner').onclick = () => $('banner').hidden = true;
$('dice').onclick = () => { clearTimeout(diceTimer); $('dice').hidden = true; };

async function poll() {
  try {
    const text = await (await fetch(`state/${slug}.json`, { cache: 'no-store' })).text();
    if (text === lastText) return;
    state = JSON.parse(text);  // 쓰는 도중에 읽혀서 깨진 JSON이면 여기서 던지고 다음 폴링에 다시 읽는다
    lastText = text;
    if (state.scene && state.scene.id !== sceneId) { if (sceneId !== undefined) tab = 'scene'; sceneId = state.scene.id; shown = 1; }
    render();
    const latest = state.rolls.at(-1);
    // 장면 대본이 있으면 굴림은 해당 줄을 넘길 때 재생한다 (결과 스포일러 방지)
    if (!state.scene && lastRollId !== undefined && latest && latest.id !== lastRollId) playRoll(latest);
    lastRollId = latest ? latest.id : null;
  } catch (e) {
    if (!state) $('view').replaceChildren(h('p', { class: 'empty' }, slug ? `state/${slug}.json 을 읽지 못함` : '주소에 ?c=<캠페인-슬러그> 를 붙여야 함'));
  }
}
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button, summary')) { e.preventDefault(); !$('banner').hidden ? $('banner').click() : $('dice').hidden ? advance() : $('dice').click(); } });
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
